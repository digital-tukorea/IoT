# 작업 모드 전환 발화.
#
# set_activity_mode는 말한 이름과 불투명 key(mode-<32자리 hex>)를 모두 받는다.
# model이 list_activity_modes로 key를 찾아 보내든 들은 이름을 그대로 보내든
# 같은 모드를 고른 것으로 본다. 두 후보 모두 tests/eval/fixtures.py의
# ACTIVITY_MODE_CATALOG와 일치해야 한다.

# --- 공부 모드 ---
- utterance: "공부 모드로 바꿔줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부 모드 켜줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부할래"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "이제 공부 시작할게"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부하는 환경으로 세팅해줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "스터디 모드"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "집중해서 공부할 수 있게 해줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부 모드로 전환 부탁해"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "시험 기간이라 공부해야 돼, 모드 바꿔줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부 모드 적용"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "책상 공부 모드로 해줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

- utterance: "공부용 세팅으로 돌려줘"
  expected_tool: set_activity_mode
  expected_args_match: {mode: {any_of: ["mode-11111111111111111111111111111111", "공부 모드"]}}

